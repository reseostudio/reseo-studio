<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Reception Environment -->
    <linearGradient id="bgAmbient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6E0E2"/>
      <stop offset="30%" stop-color="#E8E4DB"/>
      <stop offset="70%" stop-color="#F3EFE7"/>
      <stop offset="100%" stop-color="#E4DDD0"/>
    </linearGradient>

    <!-- Polished White/Grey Marble Surface -->
    <linearGradient id="marbleSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FAF8F5"/>
      <stop offset="70%" stop-color="#EDE7DC"/>
      <stop offset="100%" stop-color="#D5CCC0"/>
    </linearGradient>

    <!-- Rich Wood Cabinetry Under Marble Counter -->
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#845336"/>
      <stop offset="50%" stop-color="#A56E4A"/>
      <stop offset="100%" stop-color="#734226"/>
    </linearGradient>

    <!-- Brass Gold Tap Gradient -->
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Acrylic Stand Drop Shadow -->
    <filter id="acrylicDropShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="22" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.14"/>
    </filter>

    <!-- Glowing Spherical Lights -->
    <radialGradient id="pendantGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="45%" stop-color="#FFFBEB" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#FEF3C7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. BACKGROUND ARCHITECTURE & RECEPTION ENVIRONMENT (Soft Focus) -->
  <rect width="1200" height="1200" fill="url(#bgAmbient)"/>

  <!-- Modern Floor-to-Ceiling Windows on Left -->
  <g opacity="0.85" filter="blur(6px)">
    <!-- Window Glazing -->
    <rect x="50" y="0" width="380" height="680" fill="#CBDADB" opacity="0.6"/>
    <line x1="240" y1="0" x2="240" y2="680" stroke="#7A8F9E" stroke-width="10"/>
    <line x1="50" y1="320" x2="430" y2="320" stroke="#7A8F9E" stroke-width="8"/>
    
    <!-- Sunlit Green Fiddle-Leaf Fig Indoor Plant -->
    <g transform="translate(160, 420)">
      <ellipse cx="-40" cy="-60" rx="85" ry="130" fill="#2D5A27" opacity="0.85"/>
      <ellipse cx="20" cy="-110" rx="90" ry="110" fill="#3D7833" opacity="0.9"/>
      <ellipse cx="-60" cy="-140" rx="75" ry="95" fill="#234B1E" opacity="0.9"/>
      <ellipse cx="5" cy="-200" rx="70" ry="85" fill="#4B8E3F" opacity="0.85"/>
      <ellipse cx="50" cy="-80" rx="60" ry="80" fill="#316329" opacity="0.8"/>
      <!-- Planter Pot -->
      <path d="M -55 80 L 55 80 L 45 180 L -45 180 Z" fill="#E2DDD5" stroke="#C8C2B7" stroke-width="2"/>
    </g>

    <!-- Reception Lounge Seating -->
    <g transform="translate(320, 520)" fill="#D8D0C5">
      <rect x="-80" y="-120" width="160" height="80" rx="16"/>
      <rect x="-90" y="-60" width="180" height="60" rx="12"/>
    </g>

    <!-- Reception Background & Staff Figures -->
    <g transform="translate(850, 420)" opacity="0.5" filter="blur(5px)" fill="#1E293B">
      <!-- Receptionist 1 -->
      <circle cx="-50" cy="-80" r="26"/>
      <path d="M -85 -45 C -85 -45 -50 -55 -15 -45 L -10 120 L -90 120 Z"/>
      <!-- Receptionist 2 -->
      <circle cx="50" cy="-90" r="24"/>
      <path d="M 18 -55 C 18 -55 50 -65 82 -55 L 88 120 L 12 120 Z"/>
    </g>

    <!-- Warm Glowing Globe Pendant Lights -->
    <g transform="translate(1060, 160)">
      <line x1="0" y1="-160" x2="0" y2="0" stroke="#C29D5D" stroke-width="5"/>
      <circle cx="0" cy="0" r="70" fill="url(#pendantGlow)"/>
    </g>
    <g transform="translate(1110, 260)">
      <line x1="0" y1="-260" x2="0" y2="0" stroke="#C29D5D" stroke-width="4"/>
      <circle cx="0" cy="0" r="55" fill="url(#pendantGlow)"/>
    </g>
  </g>

  <!-- 2. MARBLE COUNTERTOP & COUNTER SINK -->
  <!-- Marble Counter Slab Top -->
  <polygon points="0,620 1200,560 1200,1200 0,1200" fill="url(#marbleSurface)"/>

  <!-- Marble Edge Bevel Trim -->
  <polygon points="0,1160 1200,1140 1200,1180 0,1200" fill="#C4BBB0"/>

  <!-- Warm Wooden Cabinetry on the Right Under Counter -->
  <polygon points="920,920 1200,880 1200,1200 920,1200" fill="url(#woodBase)"/>
  <line x1="1020" y1="905" x2="1020" y2="1200" stroke="#5E351E" stroke-width="2.5"/>
  <line x1="1120" y1="890" x2="1120" y2="1200" stroke="#5E351E" stroke-width="2.5"/>

  <!-- Realistic Polished Marble Veining -->
  <g opacity="0.32" stroke="#7A6F62" stroke-linecap="round" fill="none">
    <path d="M 0 800 Q 300 730 550 790 T 980 710 T 1200 660" stroke-width="3.5" filter="blur(2px)"/>
    <path d="M 150 920 Q 380 840 680 940 T 1150 820" stroke-width="2.5" filter="blur(1.5px)"/>
    <path d="M 280 1060 Q 520 980 820 1080 T 1200 980" stroke-width="4" filter="blur(3px)"/>
    <path d="M 80 700 Q 280 640 480 680" stroke-width="2" filter="blur(1px)"/>
    <path d="M 720 760 Q 900 700 1100 730" stroke-width="2.5" filter="blur(2px)"/>
  </g>

  <!-- Brass Swan-Neck Faucet & Counter Sink -->
  <g filter="blur(2px)" opacity="0.9">
    <!-- Sink Basin Inset -->
    <polygon points="940,650 1180,625 1195,700 955,725" fill="#D3CBC0" stroke="#B3A999" stroke-width="2.5"/>
    <!-- Brass Swan-Neck Faucet -->
    <path d="M 910,690 L 910,510 A 55 55 0 0 1 1020,510 L 1020,560" fill="none" stroke="url(#brassGold)" stroke-width="20" stroke-linecap="round"/>
    <rect x="898" y="675" width="24" height="25" rx="5" fill="url(#brassGold)"/>
    <!-- White Porcelain Soap Dispenser / Bottle -->
    <rect x="1090" y="490" width="70" height="120" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <rect x="1115" y="470" width="20" height="20" rx="4" fill="url(#brassGold)"/>
  </g>

  <!-- 3. REALISTIC MARBLE REFLECTION (Mirror of the Stand on the Polished Marble) -->
  <g transform="translate(360, 1020) scale(1, -0.68) skewX(-14)" opacity="0.36" filter="blur(4.5px)">
    <rect x="0" y="0" width="460" height="600" rx="20" fill="#FFFFFF"/>
    <!-- Mirrored Text & Google Colors -->
    <text x="230" y="120" font-family="'Syne', sans-serif" font-weight="900" font-size="34" fill="#0F172A" text-anchor="middle">TU EXPERIENCIA</text>
    <text x="230" y="175" font-family="'Syne', sans-serif" font-weight="900" font-size="44" fill="#E11D48" text-anchor="middle">NOS HACE MEJORES</text>
    <circle cx="230" cy="320" r="55" fill="#4285F4"/>
    <text x="230" y="490" font-family="sans-serif" font-weight="900" font-size="38" fill="#4285F4" text-anchor="middle">Google</text>
    <text x="230" y="540" font-family="sans-serif" font-weight="900" font-size="24" fill="#0F172A" text-anchor="middle">¡GRACIAS POR ELEGIRNOS!</text>
  </g>
  <!-- Fade Mask for Marble Reflection -->
  <polygon points="320,990 850,960 850,1180 320,1180" fill="url(#marbleSurface)" opacity="0.6"/>

  <!-- 4. FOREGROUND ACRYLIC STAND (Exact Perspective & Artwork from User Photograph) -->
  <!-- Contact Shadow Under Stand Base -->
  <polygon points="340,1005 830,960 855,1000 355,1040" fill="#000000" opacity="0.35" filter="blur(10px)"/>
  <polygon points="350,1012 825,970 838,985 360,1025" fill="#000000" opacity="0.55" filter="blur(4px)"/>

  <!-- Acrylic Slanted L-Foot -->
  <polygon points="345,980 825,945 850,990 355,1025" fill="#F4F1EB" stroke="#DDD6CB" stroke-width="2.5"/>
  <polygon points="355,1025 850,990 844,1000 350,1035" fill="#C9C1B2"/>

  <!-- Main Acrylic Vertical Face (Beveled Methacrylate Sheet) -->
  <g filter="url(#acrylicDropShadow)">
    <!-- Acrylic Backing / Side Edge -->
    <polygon points="355,420 785,425 830,975 395,1015" fill="#E6E1D6"/>
    <!-- Acrylic Front White Glossy Face -->
    <polygon points="358,422 782,427 827,973 398,1012" fill="#FFFFFF" stroke="#F4F1EA" stroke-width="2.5"/>

    <!-- Artwork Graphic Content (Positioned & Angled on Stand) -->
    <g transform="translate(590, 715) rotate(1.2)">
      
      <!-- Top Sunburst Rays & "TU EXPERIENCIA" -->
      <g transform="translate(0, -235)">
        <!-- Left 3 Sun Rays (Golden/Amber) -->
        <line x1="-140" y1="-10" x2="-110" y2="-3" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="-135" y1="10" x2="-108" y2="5" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="-122" y1="28" x2="-102" y2="15" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        
        <!-- Header Text -->
        <text x="0" y="12" font-family="'Syne', 'Montserrat', sans-serif" font-weight="900" font-size="21" letter-spacing="2.5" fill="#0F172A" text-anchor="middle">TU EXPERIENCIA</text>
        
        <!-- Right 3 Sun Rays (Golden/Amber) -->
        <line x1="140" y1="-10" x2="110" y2="-3" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="135" y1="10" x2="108" y2="5" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="122" y1="28" x2="102" y2="15" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
      </g>

      <!-- Main Headline: "NOS HACE" & "MEJORES" -->
      <text x="0" y="-178" font-family="'Syne', 'Montserrat', sans-serif" font-weight="900" font-size="40" letter-spacing="1" fill="#0F172A" text-anchor="middle">NOS HACE</text>
      <text x="0" y="-134" font-family="'Syne', 'Montserrat', sans-serif" font-weight="900" font-size="48" letter-spacing="1.5" fill="#E11D48" text-anchor="middle">MEJORES</text>
      <!-- Black Underline Curve -->
      <path d="M -90 -120 Q 0 -106 90 -120" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>

      <!-- NFC Waves (Navy Blue Arcs) -->
      <g transform="translate(0, -92)">
        <path d="M -28 -7 A 32 32 0 0 1 28 -7" fill="none" stroke="#0F172A" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M -18 5 A 20 20 0 0 1 18 5" fill="none" stroke="#0F172A" stroke-width="5.5" stroke-linecap="round"/>
        <circle cx="0" cy="16" r="4.5" fill="#0F172A"/>
      </g>

      <!-- Decorative Confetti & Icons -->
      <!-- Left Red Heart Outline -->
      <g transform="translate(-135, -55) scale(1.1)">
        <path d="M 0 0 C -16 -22 -38 0 0 34 C 38 0 16 -22 0 0 Z" fill="none" stroke="#E11D48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Right Yellow Star Outline -->
      <g transform="translate(135, -55) scale(1.1)">
        <polygon points="0,-18 5.5,-6 18,-6 8,3.5 11.5,16 0,8 -11.5,16 -8,3.5 -18,-6 -5.5,-6" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Confetti Marks -->
      <line x1="-145" y1="-20" x2="-122" y2="-8" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="125" y1="-85" x2="140" y2="-68" stroke="#10B981" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-140" y1="20" x2="-118" y2="20" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="130" y1="-2" x2="150" y2="10" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-138" y1="58" x2="-116" y2="72" stroke="#10B981" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="136" y1="42" x2="152" y2="58" stroke="#E11D48" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Large Official Google 4-Color "G" Emblem -->
      <g transform="translate(-38, -38) scale(3.2)">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </g>

      <!-- Pill Button: "))) ACERCA TU MÓVIL Y DÉJANOS TU RESEÑA" -->
      <g transform="translate(0, 82)">
        <rect x="-135" y="-18" width="270" height="36" rx="18" fill="#0F172A"/>
        <!-- Contactless Wave Icon -->
        <text x="-112" y="6" font-family="sans-serif" font-weight="900" font-size="14" fill="#60A5FA">)))</text>
        <text x="-94" y="-2" font-family="sans-serif" font-weight="900" font-size="10.5" letter-spacing="1" fill="#FFFFFF">ACERCA TU MÓVIL</text>
        <text x="-94" y="10" font-family="sans-serif" font-weight="800" font-size="9" letter-spacing="0.6" fill="#93C5FD">Y DÉJANOS TU RESEÑA</text>
      </g>

      <!-- 5 Golden Review Stars -->
      <g transform="translate(0, 126)">
        <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="24" letter-spacing="6" fill="#F59E0B" text-anchor="middle">★★★★★</text>
      </g>

      <!-- Legend "DÉJANOS TU RESEÑA EN" -->
      <text x="0" y="154" font-family="sans-serif" font-weight="800" font-size="13" letter-spacing="1" fill="#0F172A" text-anchor="middle">DÉJANOS TU RESEÑA EN</text>
      
      <!-- Multi-Color Official Google Typography -->
      <g transform="translate(0, 190) scale(1.35)">
        <text x="-52" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#4285F4">G</text>
        <text x="-31" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#EA4335">o</text>
        <text x="-14" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#FBBC05">o</text>
        <text x="3" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#4285F4">g</text>
        <text x="21" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#34A853">l</text>
        <text x="30" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#EA4335">e</text>
      </g>

      <!-- Bottom Thank You Message -->
      <text x="0" y="230" font-family="sans-serif" font-weight="800" font-size="12" letter-spacing="0.5" fill="#0F172A" text-anchor="middle">♡ ¡GRACIAS POR ELEGIRNOS!</text>
    </g>

    <!-- Glossy Specular Diagonal Reflection Across Acrylic -->
    <polygon points="360,425 550,426 470,1005 398,1015" fill="#FFFFFF" opacity="0.32" pointer-events="none"/>
  </g>
</svg>
