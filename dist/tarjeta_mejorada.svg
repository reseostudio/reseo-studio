<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="100%" height="100%">
  <defs>
    <!-- Realistic Concrete Stone Texture Gradient -->
    <radialGradient id="stoneSurfaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#E5DFD7"/>
      <stop offset="45%" stop-color="#DAD3CA"/>
      <stop offset="80%" stop-color="#CBC4B9"/>
      <stop offset="100%" stop-color="#BBB3A7"/>
    </radialGradient>

    <!-- Card Natural Drop Shadow on Concrete -->
    <filter id="pocketCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000000" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.14"/>
    </filter>

    <!-- Card White Glossy Polymer Face -->
    <linearGradient id="cardPolymerFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FAF9F7"/>
      <stop offset="100%" stop-color="#F2EFEB"/>
    </linearGradient>
  </defs>

  <!-- 1. REALISTIC CONCRETE / NATURAL STONE BACKGROUND -->
  <rect width="1200" height="1200" fill="url(#stoneSurfaceGrad)"/>

  <!-- Natural Concrete Specks, Grain, Micro-Pores & Organic Texture -->
  <g fill="#7A7165" opacity="0.35">
    <circle cx="150" cy="220" r="3.2"/>
    <circle cx="340" cy="110" r="2.2"/>
    <circle cx="980" cy="180" r="3.8"/>
    <circle cx="1090" cy="450" r="2.5"/>
    <circle cx="170" cy="740" r="4.2"/>
    <circle cx="280" cy="1020" r="2.8"/>
    <circle cx="940" cy="890" r="3.5"/>
    <circle cx="1070" cy="1060" r="4"/>
    <circle cx="95" cy="510" r="2.5"/>
    <circle cx="1130" cy="250" r="2"/>
    <circle cx="590" cy="95" r="3"/>
    <circle cx="620" cy="1130" r="3.5"/>
    <circle cx="220" cy="380" r="2.8"/>
    <circle cx="1020" cy="620" r="3.2"/>
    <circle cx="240" cy="890" r="2.5"/>
    <circle cx="910" cy="350" r="3"/>
    <ellipse cx="190" cy="370" rx="3.5" ry="6"/>
    <ellipse cx="1020" cy="620" rx="5" ry="2.5"/>
    <ellipse cx="240" cy="890" rx="3.5" ry="2.5"/>
    <ellipse cx="910" cy="350" rx="2.5" ry="5"/>
  </g>
  <g fill="#FFFFFF" opacity="0.45">
    <circle cx="220" cy="140" r="2.5"/>
    <circle cx="1030" cy="260" r="3"/>
    <circle cx="130" cy="940" r="2.8"/>
    <circle cx="980" cy="980" r="3.5"/>
    <circle cx="1100" cy="720" r="2.2"/>
    <circle cx="450" cy="1150" r="3"/>
    <circle cx="750" cy="60" r="2.8"/>
  </g>

  <!-- 2. POCKET NFC CARD (Vertical Format with Exact Artwork Matching Photograph) -->
  <g filter="url(#pocketCardShadow)" transform="translate(360, 190)">
    <!-- Card Plastic Shell (CR80 Standard Rounded Card) -->
    <rect x="0" y="0" width="480" height="770" rx="40" fill="#E8E4DB" stroke="#D8D1C4" stroke-width="2"/>
    <!-- Card Glossy Face Core -->
    <rect x="2.5" y="2.5" width="475" height="765" rx="38" fill="url(#cardPolymerFace)"/>

    <!-- Exact Artwork Graphics Centered Inside Card -->
    <g transform="translate(240, 350)">
      
      <!-- Top Sunburst Rays & "TU EXPERIENCIA" -->
      <g transform="translate(0, -210)">
        <!-- Left 3 Golden/Amber Sun Rays -->
        <line x1="-140" y1="-10" x2="-110" y2="-3" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="-135" y1="10" x2="-108" y2="5" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="-122" y1="28" x2="-102" y2="15" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        
        <!-- Header Text -->
        <text x="0" y="12" font-family="'Syne', 'Montserrat', sans-serif" font-weight="900" font-size="21" letter-spacing="2.6" fill="#0F172A" text-anchor="middle">TU EXPERIENCIA</text>
        
        <!-- Right 3 Golden/Amber Sun Rays -->
        <line x1="140" y1="-10" x2="110" y2="-3" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="135" y1="10" x2="108" y2="5" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="122" y1="28" x2="102" y2="15" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
      </g>

      <!-- Main Headline: "NOS HACE" & "MEJORES" -->
      <text x="0" y="-150" font-family="'Syne', 'Montserrat', sans-serif" font-weight="900" font-size="44" letter-spacing="1" fill="#0F172A" text-anchor="middle">NOS HACE</text>
      <text x="0" y="-102" font-family="'Syne', 'Montserrat', sans-serif" font-weight="900" font-size="52" letter-spacing="1.5" fill="#E11D48" text-anchor="middle">MEJORES</text>
      <!-- Black Underline Curve -->
      <path d="M -100 -88 Q 0 -72 100 -88" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>

      <!-- NFC Waves (Navy Blue Arcs) -->
      <g transform="translate(0, -60)">
        <path d="M -30 -8 A 34 34 0 0 1 30 -8" fill="none" stroke="#0F172A" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M -20 5 A 22 22 0 0 1 20 5" fill="none" stroke="#0F172A" stroke-width="5.5" stroke-linecap="round"/>
        <circle cx="0" cy="18" r="4.5" fill="#0F172A"/>
      </g>

      <!-- Decorative Confetti & Icons -->
      <!-- Left Red Heart Outline -->
      <g transform="translate(-145, -22) scale(1.15)">
        <path d="M 0 0 C -16 -22 -38 0 0 34 C 38 0 16 -22 0 0 Z" fill="none" stroke="#E11D48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Right Yellow Star Outline -->
      <g transform="translate(145, -22) scale(1.15)">
        <polygon points="0,-18 5.5,-6 18,-6 8,3.5 11.5,16 0,8 -11.5,16 -8,3.5 -18,-6 -5.5,-6" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <!-- Confetti Marks -->
      <line x1="-155" y1="12" x2="-132" y2="24" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="135" y1="-52" x2="150" y2="-36" stroke="#10B981" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-150" y1="55" x2="-128" y2="55" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="140" y1="32" x2="160" y2="44" stroke="#3B82F6" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-146" y1="92" x2="-125" y2="108" stroke="#10B981" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="146" y1="74" x2="162" y2="90" stroke="#E11D48" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Large Official Google 4-Color "G" Emblem -->
      <g transform="translate(-38, -5) scale(3.3)">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </g>

      <!-- Pill Button: "))) ACERCA TU MÓVIL Y DÉJANOS TU RESEÑA" -->
      <g transform="translate(0, 118)">
        <rect x="-135" y="-18" width="270" height="36" rx="18" fill="#0F172A"/>
        <!-- Contactless Wave Icon -->
        <text x="-112" y="6" font-family="sans-serif" font-weight="900" font-size="14" fill="#60A5FA">)))</text>
        <text x="-94" y="-2" font-family="sans-serif" font-weight="900" font-size="10.5" letter-spacing="1" fill="#FFFFFF">ACERCA TU MÓVIL</text>
        <text x="-94" y="10" font-family="sans-serif" font-weight="800" font-size="9" letter-spacing="0.6" fill="#93C5FD">Y DÉJANOS TU RESEÑA</text>
      </g>

      <!-- 5 Golden Review Stars -->
      <g transform="translate(0, 162)">
        <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="24" letter-spacing="6" fill="#F59E0B" text-anchor="middle">★★★★★</text>
      </g>

      <!-- Legend "DÉJANOS TU RESEÑA EN" -->
      <text x="0" y="190" font-family="sans-serif" font-weight="800" font-size="13" letter-spacing="1" fill="#0F172A" text-anchor="middle">DÉJANOS TU RESEÑA EN</text>
      
      <!-- Multi-Color Official Google Typography -->
      <g transform="translate(0, 228) scale(1.4)">
        <text x="-52" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#4285F4">G</text>
        <text x="-31" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#EA4335">o</text>
        <text x="-14" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#FBBC05">o</text>
        <text x="3" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#4285F4">g</text>
        <text x="21" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#34A853">l</text>
        <text x="30" y="0" font-family="'Montserrat', 'Arial', sans-serif" font-weight="800" font-size="26" fill="#EA4335">e</text>
      </g>

      <!-- Bottom Thank You Message -->
      <text x="0" y="268" font-family="sans-serif" font-weight="800" font-size="12" letter-spacing="0.5" fill="#0F172A" text-anchor="middle">♡ ¡GRACIAS POR ELEGIRNOS!</text>
    </g>

    <!-- Subtle Diagonal Gloss Overlay -->
    <path d="M 2.5 2.5 L 220 2.5 L 80 762 L 2.5 762 Z" fill="#FFFFFF" opacity="0.14" pointer-events="none"/>
  </g>
</svg>
